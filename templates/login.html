<!doctype html>
<html>
<head>
    <title>Login – Fyers Auto Trading</title>
    <meta charset="utf-8" />
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e7eb;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            padding: 32px 40px;
            border-radius: 14px;
            width: 360px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
        }

        p.subtitle {
            margin: 0;
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin: 12px 0 4px;
            color: #cbd5e1;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        input:focus {
            border-color: #3b82f6;
            outline: none;
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            border: 0;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            background: #7f1d1d;
            border: 1px solid #b91c1c;
            padding: 8px;
            border-radius: 6px;
            color: #fecaca;
            margin-bottom: 10px;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Secure Login</h1>
        <p class="subtitle">Fyers Auto-Trading Dashboard</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" autocomplete="off" autofocus />

            <label>Password</label>
            <input type="password" name="password" autocomplete="off" />

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
