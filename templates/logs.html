<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Recent logs - Latest 200</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            padding: 16px;
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background: #0b1120;
            color: #e5e7eb;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }
        .log-container {
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            background: #0f172a;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
        }
        .log-line {
            padding: 6px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-separator {
            height: 1px;
            background: #1f2937;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <h2 style="margin:0;">Recent logs - Latest 200</h2>
    </div>
    <div id="log-stream" class="log-container">
        <div id="log-body">
            {% if lines %}
                {% for line in lines %}
                    <div class="log-line">{{ line|safe }}</div>
                    {% if not loop.last %}<div class="log-separator"></div>{% endif %}
                {% endfor %}
            {% else %}
                <div class="log-line">No logs yet.</div>
            {% endif %}
        </div>
    </div>

    <script>
        function startStream() {
            const target = document.getElementById("log-body");
            if (!target) return;
            const evtSource = new EventSource("{{ url_for('logs_stream') }}");
            evtSource.onmessage = function (event) {
                const lineDiv = document.createElement("div");
                lineDiv.className = "log-line";
                lineDiv.innerHTML = event.data;
                const sep = document.createElement("div");
                sep.className = "log-separator";

                const atBottom = Math.abs((target.scrollHeight - target.clientHeight) - target.scrollTop) < 10;
                target.appendChild(lineDiv);
                target.appendChild(sep);

                // keep to latest ~200 lines (line+sep counts as 2 nodes)
                while (target.childElementCount > 400) {
                    target.removeChild(target.firstChild);
                }

                if (atBottom) {
                    target.scrollTop = target.scrollHeight;
                }
            };
            evtSource.onerror = function (err) {
                console.warn("Log stream error", err);
            };
        }

        document.addEventListener("DOMContentLoaded", startStream);
    </script>
</body>
</html>
