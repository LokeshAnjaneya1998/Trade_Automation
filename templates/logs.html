<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Recent logs - Latest 200</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            padding: 16px;
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background: #0b1120;
            color: #e5e7eb;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }
        .log-container {
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            background: #0f172a;
            max-height: calc(100vh - 70px);
            overflow-y: auto;
        }
        .log-line {
            padding: 6px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-separator {
            height: 1px;
            background: #1f2937;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <h2>Recent logs - Latest 200</h2>
    <div id="log-stream" class="log-container">
        {% if lines %}
            {% for line in lines %}
                <div class="log-line">{{ line|safe }}</div>
                {% if not loop.last %}<div class="log-separator"></div>{% endif %}
            {% endfor %}
        {% else %}
            <div class="log-line">No logs yet.</div>
        {% endif %}
    </div>

    <script>
        async function refreshLogs() {
            try {
                const res = await fetch("{{ url_for('logs_snippet') }}", { cache: "no-store" });
                if (!res.ok) return;
                const html = await res.text();
                const target = document.getElementById("log-stream");
                if (target) {
                    target.innerHTML = html;
                }
            } catch (err) {
                console.error("Log refresh failed", err);
            }
        }
        // lightweight polling to approximate realtime updates
        setInterval(refreshLogs, 4000);
    </script>
</body>
</html>
